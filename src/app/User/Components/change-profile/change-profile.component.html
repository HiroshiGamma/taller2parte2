<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <p class="text-center text-gray-700 mb-4">Ingrese sus nuevos datos aquí, si hay alguno que no quiera cambiar vuelva a ingresar el mismo dato.</p>
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
        <input id="name" formControlName="name" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
      </div>
      <div class="mb-4">
        <label for="birthdate" class="block text-sm font-medium text-gray-700">Birthdate:</label>
        <input id="birthdate" formControlName="birthdate" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
      </div>
      <div class="mb-4">
        <label for="gender" class="block text-sm font-medium text-gray-700">Gender:</label>
        <select id="gender" formControlName="gender" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          <option *ngFor="let gender of genders" [ngValue]="gender">{{ gender }}</option>
        </select>
      </div>
      <button type="submit" class="w-full inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Update Profile</button>
    </form>
    <div *ngIf="successMessage" class="mt-4 p-4 bg-green-100 text-green-700 rounded">
      {{ successMessage }}
      <div *ngIf="updatedData">
        <p><strong>Name:</strong> {{ updatedData.name }}</p>
        <p><strong>Birthdate:</strong> {{ updatedData.birthdate }}</p>
        <p><strong>Gender:</strong> {{ updatedData.gender }}</p>
      </div>
    </div>
    <button (click)="goBack()" class="w-full inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 mt-4">Volver</button>
  </div>
</div>
