<div class="p-6 max-w-sm mx-auto bg-white rounded-xl shadow-md space-y-4">
  <h2 class="text-xl font-bold">Eliminar Cuenta</h2>
  <p class="text-gray-500">Esta acción es irreversible. Por favor, confirme si desea eliminar su cuenta.</p>
  <button (click)="openModal()" class="w-full bg-red-500 text-white py-2 px-4 rounded hover:bg-red-700">
    Eliminar Cuenta
  </button>
  <button (click)="cancel()" class="w-full bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-700 mt-2">
    Cancelar
  </button>
</div>

<!-- Modal de confirmación -->
<div id="confirmationModal" tabindex="-1" aria-hidden="true" class="hidden fixed inset-0 z-50 flex items-center justify-center w-full h-full">
  <div class="relative p-4 w-full max-w-md h-full md:h-auto">
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
      <div class="p-6 text-center">
        <h3 class="mb-5 text-lg font-normal text-gray-500 dark:text-gray-400">¿Está seguro de que desea eliminar su cuenta?</h3>
        <button (click)="confirmDelete()" class="text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center mr-2">
          Sí, eliminar cuenta
        </button>
        <button (click)="closeModal()" class="text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
