<form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
  <div class="mb-4">
    <label for="currentPassword" class="block text-sm font-medium text-gray-700">Contraseña Actual:</label>
    <input id="currentPassword" formControlName="currentPassword" type="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
  </div>
  <div class="mb-4">
    <label for="newPassword" class="block text-sm font-medium text-gray-700">Nueva Contraseña:</label>
    <input id="newPassword" formControlName="newPassword" type="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
  </div>
  <div class="mb-4">
    <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirmar Nueva Contraseña:</label>
    <input id="confirmPassword" formControlName="confirmPassword" type="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
  </div>
  <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Cambiar Contraseña</button>
</form>
<p class="mt-4 text-sm" [ngClass]="{'text-red-600': message.includes('Error'), 'text-green-600': message.includes('éxito')}">{{ message }}</p>
