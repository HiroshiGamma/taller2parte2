<app-navbar></app-navbar>
<div class="container mx-auto px-4 py-8">
    <div class="max-w-lg mx-auto bg-white rounded-lg shadow-md overflow-hidden">
      <div class="p-6">
        <h2 class="text-2xl font-bold text-center mb-6">Checkout</h2>
  
        <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()" class="space-y-4">
          <!-- RUT -->
          <div class="space-y-2">
            <label for="userRut" class="block text-sm font-medium text-gray-700">RUT</label>
            <input
              id="userRut"
              type="text"
              formControlName="userRut"
              class="w-full px-3 py-2 border rounded-md"
              [ngClass]="{'border-red-500': checkoutForm.get('userRut')?.invalid && checkoutForm.get('userRut')?.touched}"
              placeholder="Ingrese su RUT"
            >
            <div *ngIf="checkoutForm.get('userRut')?.invalid && checkoutForm.get('userRut')?.touched" class="text-red-500 text-sm">
              El RUT es obligatorio
            </div>
          </div>
  
          <!-- País -->
          <div class="space-y-2">
            <label for="country" class="block text-sm font-medium text-gray-700">País</label>
            <input
              id="country"
              type="text"
              formControlName="country"
              class="w-full px-3 py-2 border rounded-md"
              [ngClass]="{'border-red-500': checkoutForm.get('country')?.invalid && checkoutForm.get('country')?.touched}"
              placeholder="Ingrese su país"
            >
            <div *ngIf="checkoutForm.get('country')?.invalid && checkoutForm.get('country')?.touched" class="text-red-500 text-sm">
              El país es obligatorio
            </div>
          </div>
  
          <!-- Ciudad -->
          <div class="space-y-2">
            <label for="city" class="block text-sm font-medium text-gray-700">Ciudad</label>
            <input
              id="city"
              type="text"
              formControlName="city"
              class="w-full px-3 py-2 border rounded-md"
              [ngClass]="{'border-red-500': checkoutForm.get('city')?.invalid && checkoutForm.get('city')?.touched}"
              placeholder="Ingrese su ciudad"
            >
            <div *ngIf="checkoutForm.get('city')?.invalid && checkoutForm.get('city')?.touched" class="text-red-500 text-sm">
              La ciudad es obligatoria
            </div>
          </div>
  
          <!-- Comuna -->
          <div class="space-y-2">
            <label for="commune" class="block text-sm font-medium text-gray-700">Comuna</label>
            <input
              id="commune"
              type="text"
              formControlName="commune"
              class="w-full px-3 py-2 border rounded-md"
              [ngClass]="{'border-red-500': checkoutForm.get('commune')?.invalid && checkoutForm.get('commune')?.touched}"
              placeholder="Ingrese su comuna"
            >
            <div *ngIf="checkoutForm.get('commune')?.invalid && checkoutForm.get('commune')?.touched" class="text-red-500 text-sm">
              La comuna es obligatoria
            </div>
          </div>
  
          <!-- Dirección -->
          <div class="space-y-2">
            <label for="street" class="block text-sm font-medium text-gray-700">Dirección</label>
            <input
              id="street"
              type="text"
              formControlName="street"
              class="w-full px-3 py-2 border rounded-md"
              [ngClass]="{'border-red-500': checkoutForm.get('street')?.invalid && checkoutForm.get('street')?.touched}"
              placeholder="Ingrese su dirección"
            >
            <div *ngIf="checkoutForm.get('street')?.invalid && checkoutForm.get('street')?.touched" class="text-red-500 text-sm">
              La dirección es obligatoria
            </div>
          </div>
  
          <!-- Mensaje de Error -->
          <div *ngIf="error" class="bg-red-50 text-red-700 p-4 rounded-md">
            {{ error }}
          </div>
  
          <!-- Mensaje de Éxito -->
          <div *ngIf="success" class="bg-green-50 text-green-700 p-4 rounded-md">
            ¡Compra exitosa! Su pedido ha sido procesado.
          </div>
  
          <!-- Botón de Envío -->
          <button
            type="submit"
            [disabled]="checkoutForm.invalid || isLoading"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 disabled:bg-blue-300"
          >
            {{ isLoading ? 'Procesando...' : 'Completar compra' }}
          </button>
        </form>
      </div>
    </div>
  </div>
