<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <div *ngFor="let user of users" class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300">
    <h3 class="text-lg font-bold text-gray-900">{{ user.name }}</h3>
    <p class="text-gray-700"><strong>RUT:</strong> {{ user.rut }}</p>
    <p class="text-gray-700"><strong>Email:</strong> {{ user.email }}</p>
    <p class="text-gray-700"><strong>Birthdate:</strong> {{ user.birthdate }}</p>
    <p class="text-gray-700"><strong>Gender:</strong> {{ user.gender }}</p>
    <p class="text-gray-700"><strong>Enabled:</strong> {{ user.enabled ? 'Yes' : 'No' }}</p>
  </div>
</div>
