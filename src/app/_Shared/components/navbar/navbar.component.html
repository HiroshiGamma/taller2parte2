<nav class="bg-purple-900 border-gray-200 dark:bg-purple-900">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="/home" class="flex items-center space-x-3 rtl:space-x-reverse">
      <span class="self-center text-2xl font-semibold whitespace-nowrap text-white dark:text-white">Shop</span>
    </a>
    <div class="flex md:order-2 relative">
      <button id="dropdownButton" (click)="toggleDropdown()" class="text-white dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5 me-1 mb-4">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 8l4 4 4-4"/>
        </svg>
        <span class="sr-only">Open user menu</span>
      </button>
      <div id="dropdownMenu" [ngClass]="{'hidden': !isDropdownOpen}" class="absolute right-0 mt-6 w-44 bg-white rounded divide-y divide-gray-100 shadow dark:bg-gray-700 dark:divide-gray-600">
        <ul class="py-1 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownButton">
          <li>
            <a href="/home" class="block py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Productos</a>
          </li>
          <li *ngIf="role == 'Admin'">
            <a href="/admin_menu" class="block py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Menú administrador</a>
          </li>
          <li *ngIf="role == 'User'">
            <a href="/user_menu" class="block py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Configurar cuenta</a>
          </li>
          <li>
            <a href="/cart" class="block py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Carrito</a>
          </li>
          <li *ngIf="isLogged">
            <button (click)="logout()" class="block w-full text-left py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Cerrar sesión</button>
          </li>
          <li *ngIf="!isLogged">
            <a href="/login" class="block py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Iniciar sesión / Registrarse</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<script>
  document.getElementById('dropdownButton').addEventListener('click', function() {
    document.getElementById('dropdownMenu').classList.toggle('hidden');
  });
</script>
