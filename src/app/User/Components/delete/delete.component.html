<div class="p-6 max-w-sm mx-auto bg-white rounded-xl shadow-md space-y-4">
  <h2 class="text-xl font-bold">Eliminar Cuenta</h2>
  <p class="text-gray-500">Esta acción es irreversible. Por favor, confirme si desea eliminar su cuenta.</p>
  <button (click)="confirmDelete()" class="w-full bg-red-500 text-white py-2 px-4 rounded hover:bg-red-700">
    Eliminar Cuenta
  </button>
  <button (click)="cancel()" class="w-full bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-700 mt-2">
    Cancelar
  </button>
</div>
