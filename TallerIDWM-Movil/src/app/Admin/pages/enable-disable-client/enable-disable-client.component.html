<app-navbar></app-navbar>
<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <app-alert [message]="alertMessage"></app-alert>
  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center">Habilitar/Deshabilitar Usuario</h2>
    <div class="mb-4">
      <label for="rut" class="block text-sm font-medium text-gray-700">RUT</label>
      <input type="text" id="rut" placeholder="Ingrese RUT" #rutInput class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>
    <div class="flex justify-between">
      <button (click)="enableDisableUser(rutInput.value, true)" class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg">
        Habilitar
      </button>
      <button (click)="enableDisableUser(rutInput.value, false)" class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg">
        Deshabilitar
      </button>
    </div>
  </div>
</div>
