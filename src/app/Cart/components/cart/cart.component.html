<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Shopping Cart</h2>
    
    <ng-container *ngIf="cart$ | async as cart">
      <div *ngIf="cart.items.length === 0" class="text-center py-8">
        Your cart is empty
      </div>

      <div *ngFor="let item of cart.items" class="flex items-center border-b py-4">
        <div class="flex-grow">
          <h3 class="font-semibold text-black">{{item.productName}}</h3>
          <p class="text-gray-600">${{item.price}}</p>
          
          <div class="flex items-center mt-2">
            <button (click)="removeFromCart(item.productId)" 
                    class="px-2 py-1 border rounded">-</button>
            <span class="mx-4">{{item.quantity}}</span>
            <button (click)="addToCart(item.productId)" 
                    class="px-2 py-1 border rounded">+</button>
          </div>
        </div>
        
        <div class="text-right ml-4">
          <p class="font-semibold">${{item.price * item.quantity}}</p>
        </div>
      </div>

      <div *ngIf="cart.items.length > 0" class="mt-6">
        <div class="flex justify-between items-center border-t pt-4">
          <span class="text-xl font-bold">Total:</span>
          <span class="text-xl">${{cart.total}}</span>
        </div>
        
        <div class="mt-6 flex justify-end">
          <button (click)="checkOut()" class="bg-blue-500 text-white px-4 py-2 rounded">
            Checkout
          </button>
        </div>
      </div>
    </ng-container>
  </div>
