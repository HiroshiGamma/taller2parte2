<app-navbar></app-navbar>
<div class="mt-10">
    <div class="flex justify-center items-center p-5">
        <input type="text" placeholder="Buscar"
            class="form-input mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
            [(ngModel)]="searchQuery" (input)="filterProductsByName()"
        />
    </div>
    <div class="flex justify-center items-center p-5">
        <button class="btn btn-primary" (click)="sortByPrice()">
            Ordenar por precio {{ isSortAscending ? '↑' : '↓' }}
        </button>
    </div>
    <div class="flex justify-center items-center p-5">
        <label for="type" class="block text-sm font-medium text-gray-700">Seleccione tipo del producto</label>
        <select id="type" class="form-select mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
            [(ngModel)]="searchType" (change)="filterProductsByType()">
          <option value="Poleras">Poleras</option>
          <option value="Gorros">Gorros</option>
          <option value="Juguetería">Juguetería</option>
          <option value="Alimentación">Alimentación</option>
          <option value="Libros">Libros</option>
        </select>
    </div>
    <div class="px-5 flex justify-center items-center gap-5" *ngFor="let product of filteredArray">
        <div class="my-3">
            <product-card [product]="product"
            (delete)="deleteProduct($event)"
            (edit)="onEditProduct($event)"
            ></product-card>
        </div>
    </div>
</div>
<!-- Barra de paginación -->
<div *ngIf="totalPages > 1" class="flex justify-center my-5">
    <button 
      class="btn btn-secondary"
      [disabled]="currentPage === 1"
      (click)="goToPage(currentPage - 1)"
    >
      &lt;
    </button>

    <button 
        *ngFor="let page of [].constructor(totalPages); let i = index"
        class="btn"
        [ngClass]="{
            'btn-primary': currentPage === (i + 1),
            'btn-secondary': currentPage !== (i + 1)
        }"
        (click)="goToPage(i + 1)"
        >
        {{ i + 1 }}
    </button>

    <button 
      class="btn btn-secondary"
      [disabled]="currentPage === totalPages"
      (click)="goToPage(currentPage + 1)"
    >
      &gt;
    </button>
</div>
